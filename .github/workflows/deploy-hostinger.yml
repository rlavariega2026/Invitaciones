name: Build and deploy Invitaciones to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invitaciones-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Vite app
        run: bun run build
      - name: Check PHP backend syntax
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP backend
        run: php -l api.php
      - name: Prepare only deployable application files
        shell: bash
        run: |
          mkdir -p deployment/data
          cp -a dist/. deployment/
          cp dist/index.html "deployment/index-${GITHUB_SHA}.html"
          mkdir -p deployment/Invitacionespost
          cp dist/index.html deployment/Invitacionespost/index.html
          cp api.php .htaccess .user.ini deployment/
          cat > deployment/index.php <<PHP
          <?php
          $entry = __DIR__ . '/index-${GITHUB_SHA}.html';
          if (!is_file($entry)) { http_response_code(503); exit('Application entry is unavailable.'); }
          readfile($entry);
          PHP
          cp data/invitations.json deployment/data/
      - name: Install FTP client
        run: |
          mkdir -p "$RUNNER_TEMP/ftp-client"
          npm install --prefix "$RUNNER_TEMP/ftp-client" --no-save --ignore-scripts basic-ftp
      - name: Verify FTP destination and upload without deleting remote files
        run: node .github/scripts/deploy-ftp.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
      - name: Verify public page, template asset, and API
        shell: bash
        run: |
          set -euo pipefail
          base="https://lavdigitalagency.com/Invitaciones"
          # Read the exact published index file, bypassing directory/CDN cache.
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" -H "Cache-Control: no-cache, no-store" -H "Pragma: no-cache" -D "$RUNNER_TEMP/page-headers.txt" "$base/index.php?lav_deploy=${{ github.sha }}" -o "$RUNNER_TEMP/invitaciones.html"
          page_status=$(sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$RUNNER_TEMP/page-headers.txt" | tail -n 1)
          echo "Published index.html HTTP status: ${page_status:-unknown}"
          expected_asset_path=$(grep -oE '/Invitaciones/assets/[^"]+[.]js' deployment/index.html | head -n 1)
          live_asset_path=$(grep -oE '/Invitaciones/assets/[^"]+[.]js' "$RUNNER_TEMP/invitaciones.html" | head -n 1)
          if [ -z "$expected_asset_path" ] || [ "$live_asset_path" != "$expected_asset_path" ]; then
            echo "Expected JavaScript asset: $expected_asset_path"
            echo "Hostinger index JavaScript asset: $live_asset_path"
            cat "$RUNNER_TEMP/page-headers.txt"
            head -c 1800 "$RUNNER_TEMP/invitaciones.html"
            exit 1
          fi
          asset_relative=${expected_asset_path#/Invitaciones/}
          asset_status=$(curl --silent --show-error -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" -D "$RUNNER_TEMP/asset-headers.txt" -o "$RUNNER_TEMP/deployed-app.js" -w "%{http_code}" "$base/$asset_relative?lav_deploy=${{ github.sha }}")
          echo "Public JavaScript bundle HTTP status: $asset_status"
          if [ "$asset_status" != "200" ]; then
            cat "$RUNNER_TEMP/asset-headers.txt"
            head -c 2000 "$RUNNER_TEMP/deployed-app.js"
            exit 1
          fi
          cmp "deployment/$asset_relative" "$RUNNER_TEMP/deployed-app.js"
          echo "Hostinger index.html and exact JavaScript bundle verified."
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/assets/templates/i1.jpg" -o "$RUNNER_TEMP/template.jpg"
          test -s "$RUNNER_TEMP/template.jpg"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/QR/" -o "$RUNNER_TEMP/digital-pass.html"
          grep -q 'Pase digital' "$RUNNER_TEMP/digital-pass.html"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/QR/LAV-CI-ROUTE-CHECK/" -o "$RUNNER_TEMP/unique-digital-pass.html"
          grep -q 'Pase digital' "$RUNNER_TEMP/unique-digital-pass.html"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/Invitacionespost/prueba-de-ruta/?invitationId=prueba" -o "$RUNNER_TEMP/published-invitation.html"
          grep -q '/Invitaciones/assets/' "$RUNNER_TEMP/published-invitation.html"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/api/invitations" -o "$RUNNER_TEMP/api.json"
          pass_status=$(curl --silent --show-error --output "$RUNNER_TEMP/pass-image-api.json" --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"passCode":"ci-route-check","filedata":"invalid"}' "$base/api/rsvps/pass-image")
          test "$pass_status" = "404"
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(d.error !== "El pase no existe") process.exit(1); console.log("Digital pass image endpoint verified without creating production data.");' "$RUNNER_TEMP/pass-image-api.json"
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!d.success || !Array.isArray(d.invitations)) process.exit(1); console.log("Public page, template asset, and API verified; invitations:", d.invitations.length);' "$RUNNER_TEMP/api.json"
