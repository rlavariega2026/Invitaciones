name: Build and deploy Invitaciones to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Vite app
        run: bun run build
      - name: Check PHP backend syntax
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP backend
        run: php -l api.php
      - name: Prepare only deployable application files
        shell: bash
        run: |
          mkdir -p deployment/data
          cp -a dist/. deployment/
          cp api.php .htaccess deployment/
          cp data/invitations.json deployment/data/
      - name: Install FTP client
        run: |
          mkdir -p "$RUNNER_TEMP/ftp-client"
          npm install --prefix "$RUNNER_TEMP/ftp-client" --no-save --ignore-scripts basic-ftp
      - name: Verify FTP destination and upload without deleting remote files
        run: node .github/scripts/deploy-ftp.mjs
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
      - name: Verify public page, template asset, and API
        shell: bash
        run: |
          set -euo pipefail
          base="https://lavdigitalagency.com/Invitaciones"
          if ! curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" -D "$RUNNER_TEMP/page-headers.txt" "$base/" -o "$RUNNER_TEMP/invitaciones.html"; then
            cat "$RUNNER_TEMP/page-headers.txt"
            head -c 1200 "$RUNNER_TEMP/invitaciones.html"
            exit 1
          fi
          grep -q '/Invitaciones/assets/' "$RUNNER_TEMP/invitaciones.html"
          page_status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$RUNNER_TEMP/page-headers.txt")
          echo "Public page HTTP status: ${page_status:-unknown}"
          if ! grep -q '/Invitaciones/assets/' "$RUNNER_TEMP/invitaciones.html"; then
            cat "$RUNNER_TEMP/page-headers.txt"
            head -c 1200 "$RUNNER_TEMP/invitaciones.html"
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/assets/templates/i1.jpg" -o "$RUNNER_TEMP/template.jpg"
          test -s "$RUNNER_TEMP/template.jpg"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$base/api/invitations" -o "$RUNNER_TEMP/api.json"
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!d.success || !Array.isArray(d.invitations)) process.exit(1); console.log("Public page, template asset, and API verified; invitations:", d.invitations.length);' "$RUNNER_TEMP/api.json"
