name: Build for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@latest

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for Hostinger
        run: npm run build
        env:
          VITE_BASE_PATH: /invitaciones/

      - name: Include Hostinger routing configuration
        run: |
          test -f public/.htaccess
          cp public/.htaccess dist/.htaccess
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Upload Hostinger files
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-invitaciones-dist
          path: dist/
          if-no-files-found: error
