name: Build for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build for Hostinger
        run: npm run build
        env:
          VITE_BASE_PATH: /invitaciones/

      - name: Upload Hostinger files
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-invitaciones-dist
          path: dist/
          if-no-files-found: error
