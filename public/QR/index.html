<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171b2d"><title>Pase digital | LAV Invitations</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#39415a,#171b2d 65%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}
    .ticket{--accent:#bd9452;--paper:#fffaf0;position:relative;width:min(100%,470px);overflow:hidden;border-radius:26px;background:var(--paper);box-shadow:0 28px 90px #0007;border:1px solid #ffffff70}
    .ticket:before,.ticket:after{content:"";position:absolute;z-index:2;top:64%;width:26px;height:26px;border-radius:50%;background:#20263a}.ticket:before{left:-13px}.ticket:after{right:-13px}
    .top{padding:36px 32px 30px;text-align:center;color:#fff;background:linear-gradient(145deg,#262d45,#161b2d);position:relative;overflow:hidden}.top:after{content:"✦  ·  ✧  ·  ✦";position:absolute;inset:17px 0 auto;color:var(--accent);font-size:13px;letter-spacing:8px;opacity:.8}.kind{padding-top:16px;color:var(--accent);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px}.top h1{font-family:Georgia,serif;font-weight:500;font-size:30px;line-height:1.12;margin:14px 0 8px}.hosts{color:#fff9;font-family:Georgia,serif;font-style:italic;font-size:18px}.content{padding:27px 32px 30px}.guest-label{text-transform:uppercase;letter-spacing:2px;color:#888;font-size:9px;font-weight:800}.guest{font-family:Georgia,serif;font-size:28px;color:#25293b;margin:5px 0 4px;overflow-wrap:anywhere}.seats{color:#5b5d67;font-size:13px}.dash{margin:24px -32px 20px;border-top:2px dashed #d8d4cb}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}.label{color:#999;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}.value{margin-top:5px;font-size:12px;font-weight:650;color:#303342;overflow-wrap:anywhere}.location{grid-column:1/-1}.codebox{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:15px;background:#f0eee9;padding:14px 16px}.code-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#888}.code{font:700 13px ui-monospace,monospace;letter-spacing:1px;color:#292c3a;margin-top:5px}.seal{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:white;font-size:23px;box-shadow:0 4px 12px #0002}.foot{text-align:center;font-size:10px;color:#8b8990;margin-top:18px}.status{margin:24px auto;max-width:420px;text-align:center;color:white;font-size:14px}.ticket.bodas{--accent:#bd9452;--paper:#fffdf8}.ticket.xv_anos{--accent:#c477a4;--paper:#fff8fc}.ticket.graduaciones{--accent:#4e8791;--paper:#f6fbfc}.ticket.cumpleanos{--accent:#dd8063;--paper:#fff9f5}.ticket.infantiles{--accent:#6caa8b;--paper:#f8fff9}.ticket.especiales{--accent:#8271c4;--paper:#faf9ff}
    .ticket.xv_anos .top{background:radial-gradient(circle at 50% 0,#663d72,#271b3d 72%)}.ticket.graduaciones .top{background:linear-gradient(145deg,#164653,#182b40)}.ticket.cumpleanos .top{background:linear-gradient(145deg,#923f43,#321f36)}.ticket.infantiles .top{background:radial-gradient(circle at 20% 10%,#789c7e,#294d4c 75%)}.ticket.especiales .top{background:linear-gradient(145deg,#43366f,#201d3c)}
    .ticket-image{display:block;width:min(100%,600px);height:auto;border-radius:20px;box-shadow:0 28px 90px #0008}.ticket-download{display:block;margin:14px auto 0;width:max-content;border-radius:999px;background:#fff;color:#24283a;padding:11px 18px;text-decoration:none;font-size:13px;font-weight:750}
    @media(max-width:420px){body{padding:12px}.ticket{border-radius:20px}.top{padding:34px 22px 25px}.content{padding:24px 24px}.dash{margin-left:-24px;margin-right:-24px}.guest{font-size:25px}}
  </style>
</head>
<body><div id="app" class="status">Cargando tu pase digital…</div>
<script>
  const categoryNames={bodas:'Bodas & Galas',xv_anos:'XV Años',graduaciones:'Graduación',cumpleanos:'Cumpleaños',infantiles:'Celebración infantil',especiales:'Evento especial'};
  const icons={bodas:'♢',xv_anos:'✿',graduaciones:'✦',cumpleanos:'✧',infantiles:'☼',especiales:'❖'};
  const safe=(value)=>String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function createTicketImage(pass,invitation,category,date,fallback){
    const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1600;
    const ctx=canvas.getContext('2d');if(!ctx)return;
    const palette={bodas:['#bd9452','#fffdf8','#20263a'],xv_anos:['#c477a4','#fff8fc','#39213f'],graduaciones:['#4e8791','#f6fbfc','#183a43'],cumpleanos:['#dd8063','#fff9f5','#572c38'],infantiles:['#6caa8b','#f8fff9','#31574c'],especiales:['#8271c4','#faf9ff','#30294f']}[category]||['#8271c4','#faf9ff','#30294f'];
    ctx.fillStyle='#171b2d';ctx.fillRect(0,0,1200,1600);ctx.fillStyle=palette[1];ctx.beginPath();ctx.roundRect(80,70,1040,1460,46);ctx.fill();
    const grad=ctx.createLinearGradient(80,70,1120,600);grad.addColorStop(0,palette[2]);grad.addColorStop(1,'#171b2d');ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(80,70,1040,540,[46,46,0,0]);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle=palette[0];ctx.font='bold 27px Arial';ctx.fillText((categoryNames[category]||'Evento especial').toUpperCase()+' · PASE DE ACCESO',600,170);
    const fit=(text,max,font)=>{let size=font;do{ctx.font=`${size}px Georgia`;if(ctx.measureText(text).width<=max||size<=40)break;size-=4;}while(size>40);return size};
    ctx.fillStyle='#fff';ctx.font=`${fit(String(invitation.title||'Invitación'),940,68)}px Georgia`;ctx.fillText(String(invitation.title||'Invitación'),600,310);
    ctx.fillStyle='#ffffffcc';ctx.font='italic 38px Georgia';ctx.fillText(String(invitation.names||''),600,390);
    ctx.fillStyle='#858585';ctx.font='bold 24px Arial';ctx.fillText('PASE A NOMBRE DE',600,730);
    ctx.fillStyle='#25293b';ctx.font=`${fit(String(pass.guestName||''),900,72)}px Georgia`;ctx.fillText(String(pass.guestName||''),600,825);
    const seats=Math.max(1,Number(pass.companionsCount)||1);ctx.fillStyle='#5b5d67';ctx.font='32px Arial';ctx.fillText(`${seats} ${seats===1?'asiento autorizado':'asientos autorizados'}`,600,890);
    ctx.strokeStyle='#d8d4cb';ctx.setLineDash([12,12]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(130,970);ctx.lineTo(1070,970);ctx.stroke();ctx.setLineDash([]);
    const detail=(label,value,x,y)=>{ctx.textAlign='left';ctx.fillStyle='#999';ctx.font='bold 22px Arial';ctx.fillText(label.toUpperCase(),x,y);ctx.fillStyle='#303342';ctx.font='30px Arial';ctx.fillText(String(value||'Por confirmar'),x,y+48)};
    detail('Fecha',date,150,1060);detail('Hora',invitation.eventTime,650,1060);detail('Lugar',invitation.eventLocation,150,1200);
    ctx.fillStyle='#f0eee9';ctx.beginPath();ctx.roundRect(130,1330,940,110,24);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#888';ctx.font='bold 20px Arial';ctx.fillText('CÓDIGO DE ACCESO',165,1375);ctx.fillStyle='#292c3a';ctx.font='bold 30px monospace';ctx.fillText(String(pass.qrCode||''),165,1420);
    ctx.textAlign='center';ctx.fillStyle='#8b8990';ctx.font='20px Arial';ctx.fillText('Presenta este pase en la entrada · LAV Invitations',600,1490);
    const filedata=canvas.toDataURL('image/png');
    const saved=await fetch('../api/rsvps/pass-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passCode:pass.qrCode,filedata})});
    const result=await saved.json();if(!saved.ok||!result.success)throw new Error(result.error||'No se pudo guardar el boleto PNG');
    return result.imageUrl;
  }
  async function loadPass(){
    const code=new URLSearchParams(location.search).get('passCode');
    const root=document.getElementById('app');
    if(!code){root.textContent='Este enlace no contiene un código de pase válido.';return;}
    try{
      const response=await fetch('../api/rsvps/pass/'+encodeURIComponent(code),{headers:{Accept:'application/json'}});
      const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'No se encontró el pase');
      const {pass,invitation}=data;const category=categoryNames[invitation.category]?invitation.category:'especiales';
      const date=invitation.eventDate?new Date(invitation.eventDate+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}):'Por confirmar';
      root.className='ticket '+category;
      const fallback=`<header class="top"><div class="kind">${safe(categoryNames[category])} · Pase de acceso</div><h1>${safe(invitation.title)}</h1><div class="hosts">${safe(invitation.names)}</div></header><main class="content"><div class="guest-label">Pase a nombre de</div><div class="guest">${safe(pass.guestName)}</div><div class="seats">${Number(pass.companionsCount)||1} ${(Number(pass.companionsCount)||1)===1?'asiento autorizado':'asientos autorizados'}</div><div class="dash"></div><div class="details"><div><div class="label">Fecha</div><div class="value">${safe(date)}</div></div><div><div class="label">Hora</div><div class="value">${safe(invitation.eventTime||'Por confirmar')}</div></div><div class="location"><div class="label">Lugar</div><div class="value">${safe(invitation.eventLocation||'Por confirmar')}</div></div></div><div class="codebox"><div><div class="code-label">Código de acceso</div><div class="code">${safe(pass.qrCode)}</div></div><div class="seal">${icons[category]}</div></div><div class="foot">Presenta este pase en la entrada · LAV Invitations</div></main>`;
      root.className='pass-page';
      if(pass.ticketImageUrl){root.innerHTML=`<a href="${safe(pass.ticketImageUrl)}" download="${safe(pass.qrCode)}.png"><img class="ticket-image" src="${safe(pass.ticketImageUrl)}" alt="Boleto de acceso de ${safe(pass.guestName)}"></a><a class="ticket-download" href="${safe(pass.ticketImageUrl)}" download="${safe(pass.qrCode)}.png">Descargar boleto PNG</a>`;root.querySelector('img').addEventListener('error',()=>{root.className='ticket '+category;root.innerHTML=fallback;});}
      else {root.className='status';root.textContent='Preparando tu boleto personalizado…';const imageUrl=await createTicketImage(pass,invitation,category,date,fallback);root.className='pass-page';root.innerHTML=`<a href="${safe(imageUrl)}" download="${safe(pass.qrCode)}.png"><img class="ticket-image" src="${safe(imageUrl)}" alt="Boleto de acceso de ${safe(pass.guestName)}"></a><a class="ticket-download" href="${safe(imageUrl)}" download="${safe(pass.qrCode)}.png">Descargar boleto PNG</a>`;}
    }catch(error){root.textContent=error instanceof Error?error.message:'No se pudo cargar el pase. Revisa tu conexión.';}
  }
  loadPass();
</script></body></html>
